# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  db:
    ports:
      - "5432:5432"

  api:
    # Tag própria: builds de dev e prod não sobrescrevem a imagem um do outro
    image: bizo-sala-api:dev
    build:
      target: dev
    environment:
      COOKIE_SECURE: "false"
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      # Bind mount do Windows não propaga eventos de arquivo para o container
      WATCHFILES_FORCE_POLLING: "true"
      # Caches fora da pasta montada (o OneDrive trava arquivos temporários)
      RUFF_CACHE_DIR: /tmp/cache/ruff
      MYPY_CACHE_DIR: /tmp/cache/mypy
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  worker:
    image: bizo-sala-api:dev
    build:
      target: dev
    # Reinicia sozinho quando o código muda
    command: watchfiles "python -m app.worker" app
    environment:
      # Em dev os e-mails vão para o Mailpit (http://localhost:8025), nunca para fora
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      EMAIL_REMETENTE: ${SMTP_USER:-bizo-sala@localhost}
      EMAIL_INTERVALO_SEGUNDOS: "0.2"
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
    depends_on:
      - mailpit

  web:
    image: bizo-sala-web:dev
    build:
      context: ./frontend
      target: dev
    command: sh -c "npm install && npm run dev"
    environment:
      API_URL: http://api:8000
      VITE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  web-node-modules:
